# VSCode tasks configuration
tasks:
  # --- Codegen ---
  - label: "codegen: Format C++"
    command: ${workspaceFolder}/codegen/scripts/run_clang_format.sh -m -f
  - label: "codegen: Format Python"
    command: ${workspaceFolder}/codegen/scripts/run_python_check.sh -m -f
  - label: "codegen: Build"
    command: |
      bash bin/build &&
      env -u PYTHONPATH bash -lc 'source "${workspaceFolder}/codegen/build/codegen_pythonpath.sh" &&
      printf "PYTHONPATH=%s\n" "$PYTHONPATH"' >| "${workspaceFolder}/.vscode/.env"
    group:
      kind: build
      isDefault: true
    options:
      cwd: ${workspaceFolder}/codegen

  # --- FX2ONNX ---
  - label: "fx2onnx: Format"
    command: ${workspaceFolder}/fx2onnx/scripts/run-pysen-format.sh

  # --- PFVM ---
  - label: "pfvm: Format"
    command: |
      source .pfvm_venv/bin/activate &&
      bash scripts/run-pysen-format.sh
    options:
      cwd: ${workspaceFolder}/pfvm

  # --- Others ---
  - label: echofile
    command: echo ${file}

  - label: nandemo-share
    command: |
      src=${file};
      dst=${src//\/mnt\/pvc-home/\/mnt\/chip-pvc\/tmp};
      mkdir -p $(dirname $dst) &&
      cp $src $dst &&
      echo https://chip-nandemo-share.pfn.yh1-01.ingress.pfcomputing.com/file$dst

  - label: Get pod name
    command: kubectl get pods -o wide

  - label: Convert YAML/JSON
    command: python3 "${HOME}/.dotfiles/scripts/convert_yaml_json.py" ${file}

  - label: Secretary
    command: claude -p '/secretary'

# --- Global settings ---
type: shell
group: none
presentation:
  clear: true
  echo: false
  reveal: always
  showReuseMessage: true
problemMatcher: $gcc
version: 2.0.0
